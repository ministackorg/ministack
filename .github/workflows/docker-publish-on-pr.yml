name: Docker Publish on PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

env:
  DOCKERHUB_IMAGE_ORG: ministackorg/ministack-preview-build
  # Suppress docker/build-push-action's auto-generated build summary and the
  # .dockerbuild record artifact — noise on PR preview builds.
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  publish-pr:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      # Path-based guard. pull_request_target runs with repo secrets
      # (DOCKERHUB_TOKEN) and builds the PR's code, so any PR that touches the
      # build/CI surface (Dockerfile*, .dockerignore, anything under .github/)
      # must NOT be auto-built — a maintainer reviews and builds it manually.
      # The changed-file list is read through the API only, and this runs
      # before checkout, so no PR-controlled code executes when it skips.
      - name: Detect changes to the build/CI surface
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          skip_preview() {
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "plugin_changed=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=$1" >> "$GITHUB_OUTPUT"
            echo "::warning::$1"
            exit 0
          }

          pr=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
            --json changedFiles,headRefOid)
          head_before=$(printf '%s' "$pr" | jq -r '.headRefOid')
          expected_files=$(printf '%s' "$pr" | jq -r '.changedFiles')
          if [ "$head_before" != "$EVENT_HEAD" ]; then
            skip_preview "PR head changed while this run was queued; the newer synchronize event will publish the preview."
          fi

          files=$(gh api --paginate --slurp \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100")
          head_after=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
            --json headRefOid --jq '.headRefOid')
          if [ "$head_after" != "$EVENT_HEAD" ]; then
            skip_preview "PR head changed while files were being inspected; the newer synchronize event will publish the preview."
          fi

          fetched_files=$(printf '%s' "$files" | jq '[.[][]] | length')
          if [ "$fetched_files" -ne "$expected_files" ]; then
            skip_preview "GitHub returned an incomplete changed-file list; refusing to publish a preview."
          fi

          echo "Changed files:"
          printf '%s' "$files" | jq -r '.[][] | .filename'

          if printf '%s' "$files" | jq -e \
            'any(.[][]; .filename | test("^(Dockerfile([.].*)?|[.]dockerignore|[.]github/)"))' \
            >/dev/null; then
            skip_preview "PR modifies the build/CI surface; auto-preview skipped pending manual maintainer build."
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "skip_reason=" >> "$GITHUB_OUTPUT"
          if printf '%s' "$files" | jq -e \
            'any(.[][]; .filename | test("^contrib/mysql-iam-plugin/"))' \
            >/dev/null; then
            echo "plugin_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugin_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment that auto-preview was skipped
        if: steps.guard.outputs.skip == 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Auto-preview build skipped: ${{ steps.guard.outputs.skip_reason }}

      # checkout@v6 now refuses fork-PR checkouts from pull_request_target
      # unless explicitly allowed, which has failed this job for every fork PR
      # since 2026-07-20. Checking out the PR head is intentional here: the
      # guard above keeps PRs that touch the build/CI surface from reaching
      # this step, and the builds receive only non-secret version and image
      # reference arguments. persist-credentials is disabled so the untrusted
      # tree never holds the repo token — no later step needs git credentials.
      - uses: actions/checkout@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Get short SHA
        id: short_sha
        if: steps.guard.outputs.skip != 'true'
        run: |
          short_sha=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-8)
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch)
        if: steps.guard.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          # pull_request_target gets a read-only Actions cache, so caching the
          # binfmt image fails with "cache write denied". Skip it — binfmt just
          # reinstalls each run (a couple seconds), no warning.
          cache-image: false

      - name: Set up Docker Buildx
        if: steps.guard.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.guard.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Full (Debian/glibc) image — DuckDB-backed Athena, psycopg2, pymysql.
      # Built automatically for plugin-source changes so the regular preview can
      # consume artifacts from this exact PR head. The `full-preview` label remains
      # the opt-in path for other DuckDB/Postgres/MySQL end-to-end changes.
      - name: Extract metadata (full)
        id: meta_full
        if: >-
          steps.guard.outputs.skip != 'true' &&
          (steps.guard.outputs.plugin_changed == 'true' ||
          contains(github.event.pull_request.labels.*.name, 'full-preview'))
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE_ORG }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr,suffix=-${{ steps.short_sha.outputs.short_sha }}-full

      - name: Build and push (full)
        id: build_full
        if: >-
          steps.guard.outputs.skip != 'true' &&
          (steps.guard.outputs.plugin_changed == 'true' ||
          contains(github.event.pull_request.labels.*.name, 'full-preview'))
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_full.outputs.tags }}
          labels: ${{ steps.meta_full.outputs.labels }}
          build-args: |
            MINISTACK_VERSION=pr-${{ github.event.pull_request.number }}-${{ steps.short_sha.outputs.short_sha }}
          # Read-only cache on pull_request_target (see note on the regular build above).
          cache-from: type=gha,scope=full-pr

      - name: Resolve plugin donor
        id: plugin_donor
        if: steps.guard.outputs.skip != 'true'
        env:
          FULL_DIGEST: ${{ steps.build_full.outputs.digest }}
        run: |
          if [ -n "$FULL_DIGEST" ]; then
            echo "image=${DOCKERHUB_IMAGE_ORG}@${FULL_DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/ministackorg/ministack:full" >> "$GITHUB_OUTPUT"
          fi

      # ── Regular (Alpine) image ──
      - name: Extract metadata (regular)
        id: meta
        if: steps.guard.outputs.skip != 'true'
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE_ORG }}
          tags: |
            type=ref,event=pr,suffix=-${{ steps.short_sha.outputs.short_sha }}

      - name: Build and push (regular)
        id: build_regular
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MINISTACK_VERSION=pr-${{ github.event.pull_request.number }}-${{ steps.short_sha.outputs.short_sha }}
            PLUGIN_DONOR_IMAGE=${{ steps.plugin_donor.outputs.image }}
          # pull_request_target receives a read-only Actions cache as of GitHub's
          # 2026-06-26 change (read-only cache for untrusted triggers), so a cache-to
          # write fails the build with "failed to reserve cache". Restore only here;
          # the cache is populated by a trusted (push) workflow.
          cache-from: type=gha,scope=regular-pr

      - name: Verify full and regular plugin artifacts match
        if: >-
          steps.guard.outputs.skip != 'true' &&
          steps.build_full.outputs.digest != '' &&
          steps.build_regular.outputs.digest != ''
        env:
          FULL_IMAGE: ${{ env.DOCKERHUB_IMAGE_ORG }}@${{ steps.build_full.outputs.digest }}
          REGULAR_IMAGE: ${{ env.DOCKERHUB_IMAGE_ORG }}@${{ steps.build_regular.outputs.digest }}
        run: |
          set -eu
          scratch=$(mktemp -d)
          full_container=
          regular_container=
          cleanup() {
            [ -z "$full_container" ] || docker rm "$full_container" >/dev/null 2>&1 || true
            [ -z "$regular_container" ] || docker rm "$regular_container" >/dev/null 2>&1 || true
            rm -rf "$scratch"
          }
          trap cleanup EXIT

          for platform in linux/amd64 linux/arm64; do
            arch=${platform#linux/}
            rm -rf "$scratch/full" "$scratch/regular"
            mkdir -p "$scratch/full" "$scratch/regular"

            docker pull --platform "$platform" "$FULL_IMAGE"
            full_container=$(docker create --platform "$platform" "$FULL_IMAGE")
            docker cp "$full_container:/opt/ministack/mysql-plugins/." "$scratch/full"

            docker pull --platform "$platform" "$REGULAR_IMAGE"
            regular_container=$(docker create --platform "$platform" "$REGULAR_IMAGE")
            docker cp "$regular_container:/opt/ministack/mysql-plugins/." "$scratch/regular"

            test -f "$scratch/full/8.0/$arch/aws_auth_plugin.so"
            test -f "$scratch/full/8.4/$arch/aws_auth_plugin.so"
            diff -qr "$scratch/full" "$scratch/regular"

            docker rm "$full_container" "$regular_container" >/dev/null
            full_container=
            regular_container=
          done

      - name: Comment on PR with Docker image info
        if: steps.guard.outputs.skip != 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Docker image for this PR has been published: `${{ steps.meta.outputs.tags }}`
            ${{ steps.meta_full.outputs.tags && format('Full variant: `{0}`', steps.meta_full.outputs.tags) || '' }}
            Plugin donor used by the regular variant: `${{ steps.plugin_donor.outputs.image }}`
